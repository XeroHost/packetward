# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release workflow (docs/ARCHITECTURE.md section 9, docs/RELEASE-KEYS.md).
#
#   tag vX.Y.Z         -> normal GitHub release (the "stable" update channel)
#   tag vX.Y.Z-beta.N  -> GitHub pre-release (the "beta" update channel)
#
# Secrets (all optional; without them the build still runs and publishes an UNSIGNED installer):
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)  signed updater artifacts (.sig) and latest.json
#   WINDOWS_CERTIFICATE (+ _PASSWORD)        Authenticode signing of the executables and the installer
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Secrets cannot be used in step conditions; these booleans can.
  HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  HAS_AUTHENTICODE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Release helper tests
        run: node --test .github/scripts/

      # The tauri-build step of the desktop shell requires the bundled resources to exist, so the
      # service and the CLI are built first.
      - name: Build the agent service and pwctl (release)
        run: cargo build --release --locked -p packetward-agent -p packetward-cli

      - name: Import the Authenticode certificate
        if: env.HAS_AUTHENTICODE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign the service and pwctl
        if: env.HAS_AUTHENTICODE == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            target\release\packetward-agent.exe target\release\pwctl.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }

      # Validates the tag (vX.Y.Z or vX.Y.Z-beta.N) against the app version, stamps the version and the
      # signing options into the release config (not committed) and decides signed or unsigned.
      - name: Prepare the release config
        id: prep
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release.mjs prepare

      - name: Notice - unsigned build
        if: steps.prep.outputs.signed != 'true'
        shell: pwsh
        run: |
          $msg = 'TAURI_SIGNING_PRIVATE_KEY is not set: this release is built WITHOUT signed updater artifacts and latest.json is NOT published, so installed apps will not be offered this version. See docs/RELEASE-KEYS.md.'
          Write-Host "::warning title=Unsigned release::$msg"
          "### Unsigned release`n$msg" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Notice - no Authenticode signature
        if: env.HAS_AUTHENTICODE != 'true'
        shell: pwsh
        run: Write-Host "::notice title=No Authenticode signature::WINDOWS_CERTIFICATE is not set; Windows SmartScreen will warn about this installer."

      - name: Build the installer (NSIS)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: Collect the release files
        id: files
        shell: pwsh
        env:
          SIGNED: ${{ steps.prep.outputs.signed }}
        run: |
          $installers = @(Get-ChildItem target\release\bundle\nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          $out = New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item $installer.FullName $out
          $names = @($installer.Name)
          if ($env:SIGNED -eq 'true') {
            $sig = "$($installer.FullName).sig"
            if (-not (Test-Path $sig)) { throw "missing updater signature $sig" }
            Copy-Item $sig $out
            $names += "$($installer.Name).sig"
          }
          $lines = foreach ($n in $names) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $out $n)).Hash.ToLower()
            "$hash  $n"
          }
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"))
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Write latest.json (only with signed artifacts)
        if: steps.prep.outputs.signed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          INSTALLER_NAME: ${{ steps.files.outputs.installer_name }}
          SIG_PATH: dist-release/${{ steps.files.outputs.installer_name }}.sig
          NOTES: See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          OUT: dist-release/latest.json
        run: node .github/scripts/release.mjs manifest

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.prep.outputs.version }}
          PRERELEASE: ${{ steps.prep.outputs.prerelease }}
          SIGNED: ${{ steps.prep.outputs.signed }}
          INSTALLER_NAME: ${{ steps.files.outputs.installer_name }}
        run: |
          $assets = @("dist-release/$($env:INSTALLER_NAME)", 'dist-release/SHA256SUMS.txt')
          if ($env:SIGNED -eq 'true') { $assets += "dist-release/$($env:INSTALLER_NAME).sig" }
          # latest.json goes to the stable channel through "releases/latest/download": only a normal
          # release may carry it, so a beta never becomes the stable manifest.
          if ($env:SIGNED -eq 'true' -and $env:PRERELEASE -ne 'true') { $assets += 'dist-release/latest.json' }

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            $create = @('release', 'create', $env:TAG, '--title', "PacketWard $($env:VERSION)", '--generate-notes')
            if ($env:PRERELEASE -eq 'true') { $create += '--prerelease' } else { $create += '--latest' }
            gh @create @assets
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }

      # The beta channel reads latest.json from one fixed pre-release (the updater cannot use
      # "releases/latest" for pre-releases). Both beta and stable releases overwrite it, so a beta user
      # is also offered a stable release that supersedes the beta they run.
      - name: Update the beta channel manifest
        if: steps.prep.outputs.signed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = 'updater-beta'
          gh release view $channel *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $channel --prerelease --latest=false --target $env:GITHUB_SHA `
              --title 'Beta channel manifest' `
              --notes 'Holds latest.json for the PacketWard beta update channel. Not a release: do not download from here.'
            if ($LASTEXITCODE -ne 0) { throw 'could not create the beta channel release' }
          }
          gh release upload $channel dist-release/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'could not upload the beta channel manifest' }

#
# Release workflow (docs/ARCHITECTURE.md section 9, docs/RELEASE-KEYS.md).
#
# It runs ONLY for a pushed tag, never for a push to a branch:
#   tag vX.Y.Z         -> normal GitHub release (the "stable" update channel)
#   tag vX.Y.Z-beta.N  -> GitHub pre-release (the "beta" update channel)
#
# Jobs, in order. Each one needs the previous, so a failure anywhere stops everything after it:
#   guard    the tag has the right shape and points to a commit that is on the release branch (main)
#   ci       the whole CI workflow (Linux, Windows, frontend, cargo deny + audit, the desktop build)
#   build    builds and signs the installer and uploads ONLY the installer to a DRAFT release (invisible to clients).
#            The updater signature and the hash are not release assets: they travel to the last job as a private
#            workflow artifact (the "proof"), and the signature ends up only inside the updater JSON.
#   publish  re-downloads the draft, checks the installer against the proof and the updater signature against
#            the public key, publishes the release, and ONLY THEN commits stable.json / beta.json to the
#            orphan `updates` branch (a beta updates beta.json; a stable release updates both). If anything
#            fails before, no channel file is touched.
#
# Secrets (optional; without them the build still runs and publishes an UNSIGNED installer):
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)  signed updater artifacts: the signature goes into the updater JSON
#   WINDOWS_CERTIFICATE (+ _PASSWORD)        Authenticode signing of the executables and the installer
# Repository variable (optional): RELEASE_BRANCH, the branch a release tag must be on (default: main).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# A release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.shape.outputs.version }}
      prerelease: ${{ steps.shape.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag is vX.Y.Z or vX.Y.Z-beta.N
        id: shape
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release.mjs guard
      - name: The tagged commit is on the release branch
        env:
          BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
        run: |
          git fetch --no-tags origin "$BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::error title=Tag not on $BRANCH::Commit $GITHUB_SHA is not on $BRANCH. Merge it to $BRANCH first and tag that commit; nothing was built or published."
            exit 1
          fi
          echo "Commit $GITHUB_SHA is on $BRANCH."

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  build:
    name: Build and draft
    needs: [guard, ci]
    runs-on: windows-latest
    env:
      # Secrets cannot be used in step conditions; these booleans can.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_AUTHENTICODE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    outputs:
      signed: ${{ steps.prep.outputs.signed }}
      installer_name: ${{ steps.files.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # Restores the cache the CI job saved (same key); a release never saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      # The tauri-build step of the desktop shell requires the bundled resources to exist, so the
      # service and the CLI are built first.
      - name: Build the agent service and pwctl (release)
        run: cargo build --release --locked -p packetward-agent -p packetward-cli

      - name: Import the Authenticode certificate
        if: env.HAS_AUTHENTICODE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign the service and pwctl
        if: env.HAS_AUTHENTICODE == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /sha1 $env:CERT_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            target\release\packetward-agent.exe target\release\pwctl.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }

      # Validates the tag against the app version, stamps the version and the signing options into the
      # release config (not committed) and decides signed or unsigned.
      - name: Prepare the release config
        id: prep
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release.mjs prepare

      - name: Notice - unsigned build
        if: steps.prep.outputs.signed != 'true'
        shell: pwsh
        run: |
          $msg = 'TAURI_SIGNING_PRIVATE_KEY is not set: this release is built WITHOUT signed updater artifacts and the update channels are NOT touched, so installed apps will not be offered this version. See docs/RELEASE-KEYS.md.'
          Write-Host "::warning title=Unsigned release::$msg"
          "### Unsigned release`n$msg" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Notice - no Authenticode signature
        if: env.HAS_AUTHENTICODE != 'true'
        shell: pwsh
        run: Write-Host "::notice title=No Authenticode signature::WINDOWS_CERTIFICATE is not set; Windows SmartScreen will warn about this installer."

      - name: Build the installer (NSIS)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      # The release gets ONLY the installer (dist-release). Everything else is the "proof" of this build, kept as
      # a private workflow artifact for the last job: the hash of the installer and, when signed, the updater
      # signature file and the updater JSON that will be committed to the `updates` branch.
      - name: Collect the installer and the proof
        id: files
        shell: pwsh
        env:
          SIGNED: ${{ steps.prep.outputs.signed }}
        run: |
          $installers = @(Get-ChildItem target\release\bundle\nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          $out = New-Item -ItemType Directory -Force -Path dist-release
          $proof = New-Item -ItemType Directory -Force -Path proof
          Copy-Item $installer.FullName $out
          (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLower() | Out-File -FilePath (Join-Path $proof 'sha256.txt') -Encoding ascii -NoNewline
          if ($env:SIGNED -eq 'true') {
            $sig = "$($installer.FullName).sig"
            if (-not (Test-Path $sig)) { throw "missing updater signature $sig" }
            Copy-Item $sig $proof
          }
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The app verifies this signature against the public key in tauri.conf.json before it installs anything.
      # Checking it here, with the same key and format, keeps an installer the app would refuse out of the release.
      - name: Verify the updater signature with the public key
        if: steps.prep.outputs.signed == 'true'
        shell: bash
        env:
          INSTALLER_NAME: ${{ steps.files.outputs.installer_name }}
        run: node .github/scripts/verify-sig.mjs "dist-release/$INSTALLER_NAME" "proof/$INSTALLER_NAME.sig"

      # The updater JSON (signature inside) for the channel files. Never uploaded to the release.
      - name: Write the updater JSON (signed releases)
        if: steps.prep.outputs.signed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.prep.outputs.prerelease }}
          INSTALLER_NAME: ${{ steps.files.outputs.installer_name }}
          SIG_PATH: proof/${{ steps.files.outputs.installer_name }}.sig
          NOTES: See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          OUT: proof/manifest.json
        run: node .github/scripts/release.mjs manifest

      - name: Keep the proof for the last job
        uses: actions/upload-artifact@v4
        with:
          name: release-proof
          path: proof
          retention-days: 1

      # A DRAFT with only the installer: nobody (no client, no "latest" lookup) can see it until the last job.
      - name: Upload the installer to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.prep.outputs.version }}
          PRERELEASE: ${{ steps.prep.outputs.prerelease }}
        run: |
          $assets = @(Get-ChildItem dist-release -File | ForEach-Object { $_.FullName })
          $state = gh release view $env:TAG --json isDraft 2>$null | ConvertFrom-Json
          if ($state) {
            if (-not $state.isDraft) { throw "release $($env:TAG) is already published: refusing to touch it" }
            gh release upload $env:TAG @assets --clobber
          } else {
            $create = @('release', 'create', $env:TAG, '--draft', '--title', "PacketWard $($env:VERSION)", '--generate-notes')
            if ($env:PRERELEASE -eq 'true') { $create += '--prerelease' }
            gh @create @assets
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }

  publish:
    name: Verify and publish
    needs: [guard, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      SIGNED: ${{ needs.build.outputs.signed }}
      INSTALLER_NAME: ${{ needs.build.outputs.installer_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the proof of the build
        uses: actions/download-artifact@v4
        with:
          name: release-proof
          path: proof

      - name: Download the draft release
        run: |
          mkdir draft
          gh release download "$TAG" --dir draft --repo "$REPO"
          ls -l draft

      # The installer in the draft is the one that was built, nothing else is attached, and the manifest that
      # the channels will carry names this release.
      - name: Check the draft against the proof
        env:
          DIR: draft
          PROOF: proof
        run: node .github/scripts/release.mjs check-draft
      - name: Verify the updater signature with the public key
        if: env.SIGNED == 'true'
        run: node .github/scripts/verify-sig.mjs "draft/$INSTALLER_NAME" "proof/$INSTALLER_NAME.sig"

      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false --latest
          fi

      # Only now, with the installer public, the update channels move: stable.json and beta.json live in the
      # orphan `updates` branch (no code in it) and the app reads them from raw.githubusercontent.com.
      # A beta updates beta.json; a stable release updates both, so a beta user also gets a newer stable.
      - name: Update the channel files (updates branch)
        if: env.SIGNED == 'true'
        env:
          BRANCH: updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            rm -rf channels && mkdir channels && cd channels
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch -q --depth 1 origin "$BRANCH"
              git checkout -q -B "$BRANCH" FETCH_HEAD
            else
              git checkout -q --orphan "$BRANCH"
              printf '%s\n' '# Update channels' '' 'Only the JSON files the PacketWard updater reads live in this branch: `stable.json` and `beta.json`.' 'They are written by the release workflow after a release is published. There is no code here.' > README.md
            fi
            cd ..
            MANIFEST=proof/manifest.json DIR=channels node .github/scripts/release.mjs update-channels
            cd channels
            git add -A
            if git diff --cached --quiet; then echo "Channel files already up to date."; exit 0; fi
            git commit -q -m "updates: $TAG"
            if git push -q origin "$BRANCH"; then echo "Channels updated for $TAG."; exit 0; fi
            echo "push failed (attempt $attempt): another release moved the branch, retrying"
            cd ..; sleep $((attempt * 3))
          done
          echo "::error::could not update the channel files"; exit 1

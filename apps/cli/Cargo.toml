[package]
name = "packetward-cli"
description = "Basic command line client for emergency recovery and scripting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pwctl"
path = "src/main.rs"

# pwctl only does something on Windows; on other platforms the binary is a stub that says so.
[target.'cfg(windows)'.dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
pw-firewall = { path = "../../crates/pw-firewall" }
pw-ipc = { path = "../../crates/pw-ipc" }
pw-mcp = { path = "../../crates/pw-mcp" }
pw-netstat = { path = "../../crates/pw-netstat" }
pw-proto = { path = "../../crates/pw-proto" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

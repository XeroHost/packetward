[package]
name = "packetward-cli"
description = "Basic command line client for emergency recovery and scripting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pwctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pw-ipc = { path = "../../crates/pw-ipc" }
pw-proto = { path = "../../crates/pw-proto" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

[package]
name = "packetward-desktop"
description = "PacketWard desktop shell (Tauri 2). Viewer/controller; runs unelevated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "PacketWard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[lints]
workspace = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="640" height="640" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .bp-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #38BDF8;
        letter-spacing: 0.06em;
      }
      .bp-muted {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        fill: #64748B;
      }
    </style>
    <pattern id="bp-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1E293B" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="320" height="320" rx="10" fill="#070B14" />
  <rect width="320" height="320" fill="url(#bp-grid)" />

  <g stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 4">
    <line x1="20" y1="28" x2="284" y2="292" />
    <line x1="56" y1="20" x2="292" y2="256" />
    <line x1="20" y1="72" x2="256" y2="308" />
    <line x1="180" y1="12" x2="300" y2="132" />
    <line x1="300" y1="148" x2="148" y2="300" />
    <line x1="20" y1="148" x2="172" y2="300" />
  </g>

  <g transform="translate(32, 32) scale(4)">
    <path
      d="M 30 8 L 46 8 L 56 18 L 56 38 L 36 58 L 30 58 L 10 38 L 10 32"
      stroke="#38BDF8"
      stroke-width="3.6"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
    <path
      d="M 49 20 L 49 35 L 35 49"
      stroke="#38BDF8"

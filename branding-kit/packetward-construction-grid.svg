      stroke-width="1.8"
      stroke-linecap="square"
    />
    <path d="M 21 12 L 31 22" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="square" />
    <path d="M 11 13 L 28 30" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="square" />
    <polygon

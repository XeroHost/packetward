  <text x="16" y="24" class="bp-label">45° INBOUND AXIS</text>
  <text x="218" y="24" class="bp-label">45° BEVEL</text>
  <text x="16" y="304" class="bp-muted">GRID: 64×64 (4PX MODULE)</text>
  <text x="206" y="304" class="bp-label" fill="#F43F5E">NODE (35,37)</text>

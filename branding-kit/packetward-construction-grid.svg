    <polygon points="35,34 38,37 35,40 32,37" fill="#F43F5E" />
    <path d="M 11 24 L 21 34" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="square" />

    <g fill="#070B14" stroke="#F43F5E" stroke-width="0.9">
      <circle cx="30" cy="8" r="1.4" />
      <circle cx="46" cy="8" r="1.4" />
      <circle cx="56" cy="18" r="1.4" />
      <circle cx="56" cy="38" r="1.4" />
      <circle cx="36" cy="58" r="1.4" />
      <circle cx="30" cy="58" r="1.4" />
      <circle cx="10" cy="38" r="1.4" />
      <circle cx="10" cy="32" r="1.4" />

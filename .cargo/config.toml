[build]
# Windows x64 is the product target; Linux builds the platform-agnostic crates and fakes.

[target.'cfg(windows)']
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# ts-rs writes the generated TypeScript types here (see pw-proto, feature ts-export).
TS_RS_EXPORT_DIR = { value = "apps/desktop/src/types/generated", relative = true }

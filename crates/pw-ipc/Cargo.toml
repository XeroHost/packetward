[package]
name = "pw-ipc"
description = "IPC transport (named pipe and in-memory), framing, client/server, subscriptions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# In-memory transport for tests of this crate and of crates that build on it. Never used in production.
memory = []

[dependencies]
pw-proto = { path = "../pw-proto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true

# Named pipe transport and the ACL / group helpers only exist on Windows; the rest of the crate
# (framing, client, server, in-memory transport) is platform-agnostic and tested on Linux.
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[lints]
workspace = true

[package]
name = "pw-engine"
description = "Orchestrator: wires every crate together, owns tasks and state, exposes the API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# The real HTTP(S) transport of the speed test (ring needs a C toolchain). Enabled by the agent.
speed-http = ["pw-diag/speed"]

[dependencies]
pw-capture = { path = "../pw-capture" }
pw-core = { path = "../pw-core" }
pw-detect = { path = "../pw-detect" }
pw-diag = { path = "../pw-diag" }
pw-firewall = { path = "../pw-firewall" }
pw-proto = { path = "../pw-proto" }
pw-ipc = { path = "../pw-ipc" }
pw-netstat = { path = "../pw-netstat" }
base64 = "0.23"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
pw-detect = { path = "../pw-detect", features = ["testgen"] }
tempfile = "3"
pw-ipc = { path = "../pw-ipc", features = ["memory"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true

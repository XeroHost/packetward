[package]
name = "pw-store"
description = "SQLite storage: audit log, blocks, settings, intel cache, migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["bundled"]
# Compile SQLite from source (needs a C compiler). Without it the system libsqlite3 is linked,
# which is only meant for tooling that never links (clippy/check on a host without a cross compiler).
bundled = ["rusqlite/bundled"]

[dependencies]
pw-core = { path = "../pw-core" }
rusqlite = { version = "0.43", default-features = false, features = ["cache"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

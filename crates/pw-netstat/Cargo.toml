[package]
name = "pw-netstat"
description = "TCP/UDP tables with PID, adapters, interface counters, RDP sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pw-proto = { path = "../pw-proto" }
thiserror.workspace = true

# The Win32 backend only exists on Windows; everything else (table parsing, rates, aggregation,
# interface classification, the fake) is platform-agnostic and tested on Linux.
[target.'cfg(windows)'.dependencies]
tracing.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_NetManagement",
  "Win32_System_Services",
  "Win32_Networking_WinSock",
  "Win32_Security_Authentication_Identity",
  "Win32_System_EventLog",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[lints]
workspace = true

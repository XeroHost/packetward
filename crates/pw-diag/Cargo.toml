[package]
name = "pw-diag"
description = "Ping, MTR, DNS, port check and speed test client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# The real HTTP(S) transport of the speed-test client (`speed::HttpTransport`: reqwest + rustls/ring), same setup as
# `pw-intel`'s `http` feature. Opt-in because `ring` compiles C code: the default build (all of the speed-test logic,
# the fake transport and their tests) needs no C toolchain. Enabled by the agent.
speed = ["dep:reqwest", "dep:rustls", "dep:bytes", "dep:futures-util", "dep:serde_json"]

[dependencies]
# DNS over plain UDP/TCP only: no TLS/DoH/DoT features, so no C build dependency (ring, aws-lc).
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tracing.workspace = true

# `speed` feature only. Speed-test transport: HTTP/1.1 (one TCP connection per stream; HTTP/2 would multiplex the
# parallel streams onto one connection), system proxy by default, rustls with the `ring` provider (no OpenSSL, no
# aws-lc). `stream` is needed to send an upload body from a reusable buffer.
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "system-proxy", "socks", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", optional = true }

# The ICMP helper API only exists on Windows; everything else (statistics, scheduling, reports,
# DNS logic, port-check guardrails) is platform-agnostic and tested on Linux.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
] }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# The real speed server, started in-process on 127.0.0.1:0 by `tests/speed_loopback.rs` (feature `speed`). Dev
# dependencies cannot be optional, so axum/hyper also build for the default test run (no ring: its `tls` is off).
pw-speed-server = { path = "../../tools/speed-server" }

[lints]
workspace = true

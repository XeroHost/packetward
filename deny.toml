# cargo-deny configuration. PacketWard is source-available under PolyForm Shield 1.0.0, so every
# dependency must be redistributable under a permissive license (docs/DECISIONS.md). Add a license
# here only after checking compatibility.

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices (not vulnerabilities) only matter for crates we depend on directly. Tauri pulls
# several transitive ones on Linux (gtk3 stack, zbus via the opener plugin) that we cannot upgrade.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is the standing policy for new dependencies, so entries nobody uses yet are fine
# (BSD-2-Clause, Unicode-DFS-2016 and OFL-1.1 are kept on purpose; the last one is for fonts).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OFL-1.1",
]

[licenses.private]
# Workspace crates carry LicenseRef-PolyForm-Shield-1.0.0 and are unpublished; only third-party
# crates are checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
